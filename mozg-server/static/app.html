<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мозг Иваныча · Pilot</title>
<style>
[hidden]{display:none!important}
:root{--ink:#15181c;--paper:#f8f7f3;--card:#fff;--rule:#e5e3dc;--text:#1b1e22;--muted:#71767d;--faint:#9a9da2;--red:#c0443c;--amber:#c98a1e;--green:#38845c;--blue:#3a6ea5}*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--text);font-size:14px}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.rail{background:var(--ink);color:#e9e7e2;padding:22px 10px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{padding:0 10px 18px}.brand b{display:block;font-size:17px}.brand span{font-size:12px;color:#8b9097}.user{margin:0 6px 12px;padding:10px;border:1px solid #303840;border-radius:8px;background:#101418}.user b{font-size:13px}.user small{display:block;color:#8b9097;margin-top:3px}.nav{display:flex;flex-direction:column;gap:1px}.nav button{border:0;background:transparent;color:#b9bdc3;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer}.nav button:hover,.nav button.on{background:#2a3138;color:#fff}.railfoot{margin-top:auto;border-top:1px solid #292f36;padding:12px 10px 0;color:#747b83;font-size:11px}.railfoot a{color:#a9bed5}.main{min-width:0}.top{padding:20px 28px 15px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;gap:12px}.top h1{font-size:20px;margin:0}.top .meta{color:var(--muted);font-size:12px}.wrap{padding:24px 28px 60px;max-width:1240px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:15px 16px}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.kpi{grid-column:span 3}.lab{font-size:12px;color:var(--muted)}.big{font-size:26px;font-weight:650;margin-top:4px}.sub{font-size:11.5px;color:var(--faint);margin-top:4px}.bad{color:var(--red)}.good{color:var(--green)}.warn{color:var(--amber)}h2{font-size:14px;margin:24px 0 10px}h3{font-size:14px;margin:0 0 10px}.note{color:var(--muted);font-size:12.5px;line-height:1.45}table{width:100%;border-collapse:collapse}th,td{padding:9px 7px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}th{font-size:11px;color:var(--muted);font-weight:600}.pill{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;border:1px solid var(--rule);background:#fafafa}.green{color:#2b6748;background:#edf5f0;border-color:#d3e5db}.red{color:#9b322b;background:#fbeeec;border-color:#f0d5d2}.amber{color:#8a6210;background:#fbf4e4;border-color:#eddfbf}.blue{color:#2b5580;background:#edf2f8;border-color:#d3dfed}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:5px 10px;cursor:pointer}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.btn{border:1px solid var(--rule);background:#fff;border-radius:7px;padding:8px 11px;cursor:pointer}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.formgrid label{font-size:11px;color:var(--muted)}.formgrid input,.formgrid select,.formgrid textarea{margin-top:4px;width:100%;border:1px solid var(--rule);border-radius:7px;padding:8px;background:#fff}.formgrid textarea{min-height:70px}.sourcebar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;font-size:12px}.sourcebar span{border:1px solid var(--rule);background:#fff;border-radius:20px;padding:4px 8px}.org{display:flex;flex-direction:column;gap:16px;align-items:center}.orglevel{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}.node{min-width:190px;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left}.node:hover{border-color:#b9bec3}.node.owner{background:var(--ink);color:#fff}.node small{display:block;color:var(--muted);margin-bottom:4px}.node.owner small{color:#adb4bb}.node b{font-size:13px}.node em{display:block;font-style:normal;color:var(--faint);font-size:11px;margin-top:4px}.detail{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:20}.detail[hidden]{display:none}.sheet{height:100%;width:min(520px,100%);overflow:auto;background:#fff;padding:22px 24px}.sheet.wide{width:min(1000px,100%)}.close{float:right;border:0;background:none;font-size:22px;cursor:pointer}.statusdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}.list{display:flex;flex-direction:column}.item{padding:10px 0;border-bottom:1px solid var(--rule)}.item b{font-size:13px}.item small{display:block;color:var(--muted);margin-top:3px}.migration td:first-child{font-weight:600}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:20px;z-index:50}.empty{color:var(--faint);padding:12px 0}.permrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:13px}.permrow:last-child{border-bottom:0}.permgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 20px}.switch{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:999px;background:#d3d3d7;position:relative;transition:.18s;cursor:pointer;flex:0 0 40px;margin:0}.switch:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.18s}.switch:checked{background:var(--green)}.switch:checked:after{left:21px}.permrow select{flex:0 0 150px}@media(max-width:900px){.shell{grid-template-columns:1fr}.rail{position:static;height:auto}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap}.railfoot{display:none}.kpi{grid-column:span 6}.span8,.span6,.span4{grid-column:span 12}.formgrid{grid-template-columns:1fr 1fr}.wrap,.top{padding-left:16px;padding-right:16px}}@media(max-width:560px){.kpi{grid-column:span 12}.formgrid{grid-template-columns:1fr}.big{font-size:23px}}
</style></head><body>
<div class="shell"><aside class="rail"><div class="brand"><b>Мозг Иваныча</b><span>Pilot v0.2 · гибридный переход</span></div><div class="user" id="userbox">Загрузка…</div><nav class="nav" id="nav"></nav><div class="railfoot"><span class="statusdot"></span>сервер подключен<br><a href="/logout">Выйти</a></div></aside><main class="main"><div class="top"><h1 id="title">Мозг Иваныча</h1><span class="meta" id="topmeta"></span></div><div class="wrap" id="view">Загрузка…</div></main></div>
<div class="detail" id="detail" hidden><div class="sheet" id="sheet"></div></div><div id="toast"></div>
<script>
let ME=null,LIVE=null,MEET={meetings:[]},ORG={},cur='org',CSRF='',roles={},objStatus='В работе';
const navNames={org:'Оргструктура',clients:'Клиенты',owner:'Собственнику',meetings:'Совещания',production:'Производство',objects:'Объекты',sales:'Продажи',finance:'Финансы',expenses:'Подотчёт',design:'Дизайн',hr:'HR',office:'Офис',migration:'Переход',admin:'Пользователи'};
const fmt=n=>n==null?'Н/Д':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(n))+' ₽';const mln=n=>n==null?'Н/Д':(Number(n)/1e6).toFixed(1).replace('.',',')+' млн ₽';const pct=n=>n==null?'Н/Д':Math.round(Number(n)*100)+'%';const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const today=()=>new Date().toISOString().slice(0,10);
function toast(s){document.getElementById('toast').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',2200)}
async function api(url,opt={}){opt.headers=opt.headers||{};if(opt.method&&opt.method!=='GET')opt.headers['X-CSRF-Token']=CSRF;if(opt.body&&!opt.headers['Content-Type'])opt.headers['Content-Type']='application/json';const r=await fetch(url,opt);const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||r.statusText);return j}
async function init(){const me=await api('/api/me');ME=me.user;CSRF=ME.csrf;roles=me.roles;document.getElementById('userbox').innerHTML='<b>'+esc(ME.name)+'</b><small>'+esc(ME.roleLabel)+(ME.scope?' · '+esc(ME.scope):'')+'</small>';ORG=(await api('/api/org')).org;LIVE=await api('/api/live');try{MEET=await api('/api/meetings')}catch(e){}cur=ME.pages.includes('org')?'org':ME.pages[0];renderNav();render()}
function renderNav(){document.getElementById('nav').innerHTML=ME.pages.map(p=>'<button data-page="'+p+'" class="'+(p===cur?'on':'')+'">'+(navNames[p]||p)+'</button>').join('')}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){cur=p.dataset.page;renderNav();render()}const c=e.target.closest('[data-close]');if(c)document.getElementById('detail').hidden=true});
function setTitle(t,m=''){document.getElementById('title').textContent=t;document.getElementById('topmeta').textContent=m}function sourceBar(){const p=LIVE.pilot||{};return '<div class="sourcebar"><span>● Новая БД: записи сотрудников</span><span>● Legacy: '+esc(p.legacyBridge||'демо')+'</span><span>● BitrixGPT: '+(MEET.meetings||[]).length+' встреч</span></div>'}function kpi(l,v,s,c=''){return '<div class="card kpi"><div class="lab">'+esc(l)+'</div><div class="big '+c+'">'+(typeof v==='number'?v:esc(v))+'</div><div class="sub">'+esc(s||'')+'</div></div>'}
function render(){const fn={org:vOrg,owner:vOwner,meetings:vMeetings,production:vProduction,objects:vObjects,clients:vClients,sales:vSales,finance:vFinance,expenses:vExpenses,design:vDesign,hr:vHr,office:vOffice,migration:vMigration,admin:vAdmin}[cur];document.getElementById('view').innerHTML=fn?fn():'';bind()}
function vOrg(){setTitle('Оргструктура','от роли — к правам и данным');const by=p=>Object.entries(ORG).filter(([k,v])=>v.parent===p);const n=([k,v])=>'<button class="node '+(k==='owner'?'owner':'')+'" data-org="'+k+'"><small>'+esc(v.department)+'</small><b>'+esc(v.name)+'</b><em>'+esc(v.role)+'</em></button>';return sourceBar()+'<div class="grid"><div class="card span8"><div class="org"><div class="orglevel">'+by(null).map(n).join('')+'</div><div class="orglevel">'+by('owner').map(n).join('')+'</div><div class="orglevel">'+[...by('darya'),...by('nilov')].map(n).join('')+'</div></div></div><div class="card span4" id="orginfo"><h3>Логика доступа</h3><p class="note">Оргструктура задаёт базовую роль. Затем включаются ограничения по строкам: например прораб видит только свои объекты.</p><p class="note">Нажмите сотрудника.</p></div></div>'}
function vOwner(){setTitle('Мозг собственника','отклонения, деньги, решения');const M=LIVE.management||{},f=M.finance||{},p=M.production||{},sp=((M.sales||{}).planFact)||{},mm=sp.metrics||{},cash=f.cash||{},cp=((f.pnl||{}).current)||{};return sourceBar()+'<div class="grid">'+kpi('Договоры · факт',mm.contracts&&mm.contracts.fact,'план переносим в новую БД')+kpi('Производство · факт',mln(p.fact),'план '+mln(p.plan))+kpi('Чистая прибыль',fmt(cp.netProfit),'факт ОПиУ',Number(cp.netProfit)<0?'bad':'good')+kpi('Деньги сейчас',mln(cash.closing),'резерв '+fmt(cash.safetyFund))+'<div class="card span6"><h3>Что берём из v5.6</h3><div class="list"><div class="item"><b>Сильный собственнический экран</b><small>Н/Д вместо выдуманной цифры, риски и отклонения.</small></div><div class="item"><b>BitrixGPT как память компании</b><small>Совещания и поручения не теряются.</small></div><div class="item"><b>Сильный объектный контур</b><small>Остаток, маржинальность, сроки и риски.</small></div></div></div><div class="card span6"><h3>Что добавлено из 2.0</h3><div class="list"><div class="item"><b>Логины и роли</b><small>каждый сотрудник видит свой контур</small></div><div class="item"><b>Прямая запись в приложение</b><small>новые данные уже не обязаны жить в Google Sheets</small></div><div class="item"><b>Переход по процессам</b><small>таблицы выключаются постепенно, а не одним днём</small></div></div></div></div>'}
function vMeetings(){setTitle('Совещания','BitrixGPT оставляем');return sourceBar()+'<div class="card"><div class="list">'+(MEET.meetings||[]).slice(0,80).map((m,i)=>'<button class="item btn" data-meet="'+i+'" style="text-align:left"><b>'+esc(m.topic||'Совещание')+'</b><small>'+esc(String(m.date||'').slice(0,16).replace('T',' · '))+' · '+(m.tasks||[]).length+' задач</small></button>').join('')+'</div></div>'}
function effective(o,k){return o.pilotUpdate&&o.pilotUpdate[k]?o.pilotUpdate[k]:o[k]}function objectTable(){const os=(LIVE.objects||[]).filter(o=>objStatus==='Все'||effective(o,'status')===objStatus);return '<div class="tools">'+['В работе','Заморожен','Завершен','Все'].map(s=>'<button class="chip '+(s===objStatus?'on':'')+'" data-ostatus="'+s+'">'+s+'</button>').join('')+'</div><div class="card"><table><tr><th>Объект</th><th>Прораб</th><th>Статус</th><th>Риск</th><th>Договор</th><th>Осталось</th><th>Маржа</th><th></th></tr>'+os.map(o=>'<tr><td><b>'+esc(o.addr)+'</b><div class="sub">'+(o.pilotUpdate?'новая БД · '+esc(o.pilotUpdate.creator):'legacy source')+'</div></td><td>'+esc(o.foreman||'')+'</td><td>'+esc(effective(o,'status')||'')+'</td><td>'+esc(effective(o,'reason')||'')+'</td><td>'+fmt(o.summa)+'</td><td><b>'+fmt(o.ostatok)+'</b></td><td>'+pct(o.fmarj)+'</td><td>'+(['owner','production_head','foreman'].includes(ME.role)?'<button class="btn" data-editobj="'+esc(o._key)+'">Обновить</button>':'')+'</td></tr>').join('')+'</table></div>'}
function vProduction(){setTitle('Производство','прораб видит только свои объекты');const os=LIVE.objects||[];return '<div class="grid">'+kpi('Объектов',os.length,'доступный контур')+kpi('Красных',os.filter(o=>o.color==='Красный').length,'требуют внимания')+kpi('Нужны мастера',os.filter(o=>o.need).length,'по текущим объектам')+kpi('Остаток по договорам',mln(os.reduce((s,o)=>s+(Number(o.ostatok)||0),0)),'не банковская дебиторка')+'<div class="span12">'+objectTable()+'</div></div>'}function vObjects(){setTitle('Объекты','карточка вместо разрозненных таблиц');return objectTable()}
function vSales(){setTitle('Продажи','факт из Bitrix, план — внутренняя БД');const mm=((((LIVE.management||{}).sales||{}).planFact||{}).metrics)||{};return '<div class="grid">'+kpi('Лиды',mm.leads&&mm.leads.fact,'факт')+kpi('Замеры',mm.measurements&&mm.measurements.fact,'факт')+kpi('Договоры',mm.contracts&&mm.contracts.fact,'факт')+kpi('Замер → договор',pct(mm.measurementToContract&&mm.measurementToContract.fact),'факт')+'<div class="card span6"><h3>План месяца</h3><div class="formgrid" style="grid-template-columns:repeat(3,1fr)"><label>Лиды<input id="spl" type="number"></label><label>Замеры<input id="spm" type="number"></label><label>Договоры<input id="spc" type="number"></label></div><button class="btn primary" id="saveplan" style="margin-top:10px">Сохранить в новой БД</button><p class="note">Это один из первых процессов, который можно убрать из таблиц.</p></div><div class="card span6"><h3>Правило</h3><p class="note">CRM-факт руками не дублируем. В приложении сотрудник вводит только план, прогноз, причину отклонения и следующий шаг.</p></div></div>'}
function vFinance(){setTitle('Финансы','legacy-факт + новые обязательства');const f=(LIVE.management||{}).finance||{},cash=f.cash||{},cp=((f.pnl||{}).current)||{};return '<div class="grid">'+kpi('Остаток ДДС',mln(cash.closing),'legacy-факт')+kpi('Фонд безопасности',fmt(cash.safetyFund),cash.safetyFundSource||'')+kpi('Чистая прибыль',fmt(cp.netProfit),'факт ОПиУ',Number(cp.netProfit)<0?'bad':'good')+kpi('Обязательства','новая БД','подтверждает финансы')+'<div class="card span12"><h3>Реестр обязательств</h3><p class="note">Отдел создаёт заявку → Полина подтверждает → только подтверждённые суммы попадают в ликвидность.</p><button class="btn primary" id="newpay">Новая заявка</button><div id="payrows" style="margin-top:10px">Загрузка…</div></div></div>'}
function vExpenses(){setTitle('Подотчёт','единая операция вместо отдельных листов');const opts=(LIVE.objects||[]).map(o=>'<option value="'+esc(o._key)+'">'+esc(o.addr)+'</option>').join('');return '<div class="grid"><div class="card span4"><h3>Новая операция</h3><p class="note">Структура собрана по реальному подотчёту Евгении: карта, наличные, баллы, косяки и дополнительные траты.</p><div class="formgrid" style="grid-template-columns:1fr"><label>Тип записи<select id="etype"><option>Обычная операция</option><option>Баллы</option><option>Косяк по объекту</option><option>Доп. трата / корректировка</option></select></label><label>Дата<input id="edate" type="date" value="'+today()+'"></label><label>Приход / расход<select id="edir"><option>Расход</option><option>Приход</option></select></label><label>Сумма<input id="eamount" type="number" step="0.01"></label><label>Источник денег<select id="esource"><option>Корп. карта Т-Банк</option><option>Физ. карта Т-Банк</option><option>Наличные</option><option>Другое</option></select></label><label>Контрагент<input id="ecp"></label><label>Статья прихода<input id="eincat"></label><label>Статья расхода<input id="ecat"></label><label>Объект<select id="eobj"><option value="">Не относится к объекту</option>'+opts+'</select></label><label>Сотрудник / кому выдано<input id="eemployee"></label><label>Баллы / бонусы<input id="epoints" type="number" step="0.01" value="0"></label><label>Доля ответственности, %<input id="eprop" type="number" step="0.01" value="0"></label><label>Корректировка к ЗП прораба<input id="eadj" type="number" step="0.01" value="0"></label><label>Комментарий<textarea id="enote"></textarea></label></div><button class="btn primary" id="saveexp" style="margin-top:10px">Отправить Полине на проверку</button><p class="note">Следующий шаг: фото чека, справочники статей ДДС/ОПиУ и возврат сотруднику на исправление.</p></div><div class="card span8"><h3>Операции</h3><div id="exprows">Загрузка…</div></div></div>'}
function vDesign(){setTitle('Дизайн','свои проекты и этапы');return '<div class="card"><p class="note">Дизайнер должен отвечать за этап, следующую контрольную дату, риск и готовность к передаче в производство. Документы 1С и коммуникации Bitrix не дублируем.</p></div>'}function vHr(){setTitle('HR','вакансии, кандидаты, выходы, адаптация');return '<div class="card"><p class="note">HR хранит кадровый контур. Производство видит обеспеченность людьми, но не чувствительные данные кандидатов.</p></div>'}function vOffice(){setTitle('Офис','документы, закупки, заявки, подписи');return '<div class="grid"><div class="card span6"><h3>Евгения</h3><div class="list"><div class="item"><b>Документы и подписи</b><small>подготовить / отправить / получить</small></div><div class="item"><b>Закупки</b><small>заявка + привязка к объекту</small></div><div class="item"><b>Выдачи денег</b><small>фиксирует факт, финансы подтверждают классификацию</small></div></div></div><div class="card span6"><h3>Принцип</h3><p class="note">Офис создаёт факт или заявку. Финансовый владелец решает, в какую статью ДДС/ОПиУ это попадает.</p></div></div>'}

 +'<div style="margin-top:14px;display:flex;gap:7px;flex-wrap:wrap">'
 +(edit?'<button class="btn primary" id="csave">Сохранить клиента</button>':'')
 +(id&&can('clients.archive')?'<button class="btn" id="carch">В архив</button>':'')+'</div>'
 +(id?('<h3 style="margin-top:22px">Объекты клиента</h3>'
   +(objs.length?'<div class="list">'+objs.map(o=>'<div class="item"><b>'+esc(o.title)+'</b><small>'+esc(o.address||'адрес не указан')+' · '+(o.area?n1(o.area)+' м²':'площадь не указана')+' · помещений: '+((o.rooms||[]).length)+' · '+esc(o.status||'')+'</small>'+(can('objects.view')?'<button class="btn" style="margin-top:6px" data-obj="'+o.id+'">'+(can('objects.edit')?'Изменить':'Открыть')+'</button>':'')+'</div>').join('')+'</div>':'<p class="note">Объектов пока нет.</p>')
   +(can('objects.edit')?'<button class="btn" id="newobj" style="margin-top:10px">＋ Добавить объект</button>':'')):'<p class="note" style="margin-top:18px">Объекты можно будет добавить сразу после сохранения клиента.</p>')
 );
 const g=x=>document.getElementById(x);
 if(g('ckind'))g('ckind').onchange=()=>{const co=g('ckind').value==='company';if(g('reqperson'))g('reqperson').hidden=co;if(g('reqcompany'))g('reqcompany').hidden=!co};
 if(g('csave'))g('csave').onclick=async()=>{
   const body=collectClient(cl);
   if(!body.name.trim()){toast('Укажите имя клиента');return}
   try{const r=await api('/api/client-save',{method:'POST',body:JSON.stringify(body)});toast('Клиент сохранён');loadClients();openClient(r.id)}catch(e){toast('Не сохранилось: '+e.message)}};
 if(g('carch'))g('carch').onclick=async()=>{if(!confirm('Убрать клиента «'+cl.name+'» в архив?'))return;await api('/api/client-archive',{method:'POST',body:JSON.stringify({id:id})});detail.hidden=true;toast('Клиент убран в архив');loadClients()};
 if(g('newobj'))g('newobj').onclick=()=>openObject(id,null,cl.name);
 sheet.querySelectorAll('[data-obj]').forEach(b=>b.onclick=()=>openObject(id,objs.find(o=>o.id===+b.dataset.obj),cl.name))}
function collectClient(cl){const g=x=>document.getElementById(x),v=x=>g(x)?g(x).value:'';
 return {id:cl.id||0,kind:v('ckind')||'person',name:v('cname'),phone:v('cphone'),email:v('cemail'),address:v('caddr'),source:v('csource'),manager_id:v('cmgr')||null,
  passport:v('cpass'),inn:v('cinn'),kpp:v('ckpp'),ogrn:v('cogrn'),bank:v('cbank'),bik:v('cbik'),account:v('cacc'),signatory:v('csign'),note:v('cnote')}}
let OBJCACHE={pending:null};
const ROOM_BLANK=()=>({name:'',length:0,width:0,height:2.7,doors:1,windows:1});
function openObject(clientId,o,clientName){const edit=can('objects.edit');o=o||{id:0,title:'',address:'',area:0,ceiling:2.7,rooms:[],measurer:'',designer:'',foreman:'',status:'Заявка',legacy_key:'',note:''};
 OBJCACHE.rooms=JSON.parse(JSON.stringify(o.rooms||[]));OBJCACHE.clientId=clientId;OBJCACHE.id=o.id||0;
 const names=CL.staff.map(s=>'<option value="'+esc(s.name)+'">').join('');
 openSheet('<h2>'+esc(o.title||'Новый объект')+'</h2><p class="note">'+esc(clientName||'')+' · габариты помещений понадобятся калькулятору смет</p>'
 +'<datalist id="staffnames">'+names+'</datalist>'
 +'<div class="formgrid" style="grid-template-columns:1fr 1fr">'
 +fld('otitle','Название объекта',o.title,'text',!edit)
 +'<label>Статус<select id="ostatus"'+(edit?'':' disabled')+'>'+['Заявка','Замер сделан','Смета готова','Договор','В работе','Завершён','Отказ'].map(x=>'<option'+(o.status===x?' selected':'')+'>'+x+'</option>').join('')+'</select></label>'
 +'<label style="grid-column:1/-1">Адрес<input id="oaddr" value="'+esc(o.address||'')+'"'+(edit?'':' disabled')+'></label>'
 +fld('oarea','Общая площадь, м²',o.area,'number',!edit)+fld('oceil','Высота потолков, м',o.ceiling,'number',!edit)
 +'<label>Замерщик<input id="omeas" list="staffnames" value="'+esc(o.measurer||'')+'"'+(edit?'':' disabled')+'></label>'
 +'<label>Дизайнер<input id="odes" list="staffnames" value="'+esc(o.designer||'')+'"'+(edit?'':' disabled')+'></label>'
 +'<label>Прораб<input id="ofore" list="staffnames" value="'+esc(o.foreman||'')+'"'+(edit?'':' disabled')+'></label>'
 +fld('olegacy','Номер договора в старой системе',o.legacy_key,'text',!edit)
 +'</div>'
 +'<h3 style="margin-top:18px">Помещения и габариты</h3><p class="note">Из этих размеров калькулятор смет сам посчитает площади пола, стен и периметр.</p>'
 +'<div id="roomsbox" style="margin-top:8px"></div>'
 +(edit?'<button class="btn" id="addroom" style="margin-top:8px">＋ Помещение</button>':'')
 +'<label style="display:block;margin-top:14px;font-size:11px;color:var(--muted)">Комментарий по объекту<textarea id="onote2" style="width:100%;margin-top:4px;border:1px solid var(--rule);border-radius:7px;padding:8px;min-height:56px"'+(edit?'':' disabled')+'>'+esc(o.note||'')+'</textarea></label>'
 +'<div style="margin-top:14px;display:flex;gap:7px;flex-wrap:wrap">'
 +(edit?'<button class="btn primary" id="osave">Сохранить объект</button>':'')
 +'<button class="btn" id="oback">← К карточке клиента</button>'
 +(o.id&&edit?'<button class="btn" id="oarch">В архив</button>':'')+'</div>',true);
 renderRooms(edit);
 const g=x=>document.getElementById(x);
 if(g('addroom'))g('addroom').onclick=()=>{OBJCACHE.rooms.push(ROOM_BLANK());renderRooms(edit)};
 if(g('oback'))g('oback').onclick=()=>openClient(clientId);
 if(g('oarch'))g('oarch').onclick=async()=>{if(!confirm('Убрать объект в архив?'))return;await api('/api/object-archive',{method:'POST',body:JSON.stringify({id:o.id})});toast('Объект в архиве');openClient(clientId)};
 if(g('osave'))g('osave').onclick=async()=>{collectRooms();
  const body={id:OBJCACHE.id,client_id:clientId,title:g('otitle').value,address:g('oaddr').value,area:g('oarea').value,ceiling:g('oceil').value,
   measurer:g('omeas').value,designer:g('odes').value,foreman:g('ofore').value,status:g('ostatus').value,legacy_key:g('olegacy').value,note:g('onote2').value,rooms:OBJCACHE.rooms};
  try{await api('/api/object-save',{method:'POST',body:JSON.stringify(body)});toast('Объект сохранён');openClient(clientId);loadClients()}catch(e){toast('Не сохранилось: '+e.message)}}}
function renderRooms(edit){const box=document.getElementById('roomsbox');if(!box)return;
 if(!OBJCACHE.rooms.length){box.innerHTML='<p class="note">Помещения не заданы. Нажмите «＋ Помещение» и внесите размеры — площади посчитаются сами.</p>';return}
 const dis=edit?'':' disabled';
 const cell=(i,f,st)=>'<input data-room="'+i+'" data-f="'+f+'" value="'+esc(OBJCACHE.rooms[i][f])+'" '+(st||'')+dis+' style="width:72px;border:1px solid var(--rule);border-radius:6px;padding:5px;text-align:right">';
 box.innerHTML='<div style="overflow-x:auto"><table><tr><th>Помещение</th><th>Длина, м</th><th>Ширина, м</th><th>Высота, м</th><th>Двери</th><th>Окна</th><th class="trnum">Пол, м²</th><th class="trnum">Стены, м²</th><th></th></tr>'
 +OBJCACHE.rooms.map((r,i)=>'<tr><td><input data-room="'+i+'" data-f="name" value="'+esc(r.name||'')+'"'+dis+' placeholder="Например: Гостиная" style="width:135px;border:1px solid var(--rule);border-radius:6px;padding:5px"><div class="sub" data-sum="'+i+'"></div></td>'
  +'<td>'+cell(i,'length','type=number step=0.1 min=0')+'</td><td>'+cell(i,'width','type=number step=0.1 min=0')+'</td><td>'+cell(i,'height','type=number step=0.01 min=0')+'</td>'
  +'<td>'+cell(i,'doors','type=number step=1 min=0')+'</td><td>'+cell(i,'windows','type=number step=1 min=0')+'</td>'
  +'<td class="trnum" data-calc="floor-'+i+'"></td><td class="trnum" data-calc="walls-'+i+'"></td>'
  +'<td>'+(edit?'<button class="btn" data-delroom="'+i+'" style="padding:4px 9px" title="Удалить помещение">✕</button>':'')+'</td></tr>').join('')
 +'<tr><td><b>Итого по объекту</b></td><td colspan="5"></td><td class="trnum" data-calc="tfloor"></td><td class="trnum" data-calc="twalls"></td><td></td></tr></table></div>';
 OBJCACHE.rooms.forEach((r,i)=>paintRoom(i));
 box.querySelectorAll('[data-room]').forEach(el=>{
   const upd=()=>{const i=+el.dataset.room,f=el.dataset.f;if(!OBJCACHE.rooms[i])return;
     OBJCACHE.rooms[i][f]=(f==='name')?el.value:(+el.value||0);if(f!=='name')paintRoom(i)};
   el.oninput=upd;el.onchange=upd});
 box.querySelectorAll('[data-delroom]').forEach(b=>b.onclick=()=>{collectRooms();OBJCACHE.rooms.splice(+b.dataset.delroom,1);renderRooms(edit)})}
function paintRoom(i){const r=OBJCACHE.rooms[i];if(!r)return;const g=geo(r),q=x=>document.querySelector('[data-calc="'+x+'"]');
 const f=q('floor-'+i),w=q('walls-'+i),sum=document.querySelector('[data-sum="'+i+'"]');
 if(f)f.innerHTML='<b>'+n1(g.floor)+'</b>';if(w)w.innerHTML='<b>'+n1(g.walls)+'</b>';
 if(sum)sum.textContent='пол '+n1(g.floor)+' м² · стены '+n1(g.walls)+' м² · периметр '+n1(g.per)+' м';
 let tf=0,tw=0;OBJCACHE.rooms.forEach(x=>{const gg=geo(x);tf+=gg.floor;tw+=gg.walls});
 const a=q('tfloor'),b2=q('twalls');if(a)a.innerHTML='<b>'+n1(tf)+'</b>';if(b2)b2.innerHTML='<b>'+n1(tw)+'</b>'}
function collectRooms(){document.querySelectorAll('[data-room]').forEach(el=>{const i=+el.dataset.room,f=el.dataset.f;if(OBJCACHE.rooms[i])OBJCACHE.rooms[i][f]=(f==='name')?el.value:(+el.value||0)})}

/* ───────── Настройка доступов (конструктор прав) ───────── */
let PM=null;
async function bindPerms(){if(!can('admin.perms'))return;const host=document.getElementById('permhost');if(!host)return;
 try{PM=await api('/api/perms')}catch(e){host.innerHTML='<p class="note">Нет доступа к настройке прав.</p>';return}
 const roleOpts=Object.entries(PM.roles).map(([k,v])=>'<option value="'+k+'">'+esc(v)+'</option>').join('');
 host.innerHTML='<div class="formgrid" style="grid-template-columns:1fr"><label>Роль<select id="pmrole">'+roleOpts+'</select></label></div><div id="pmbox" style="margin-top:10px"></div><button class="btn primary" id="pmsave" style="margin-top:10px">Сохранить доступы роли</button>';
 const sel=document.getElementById('pmrole');sel.onchange=()=>drawPerms(sel.value);drawPerms(sel.value);
 document.getElementById('pmsave').onclick=async()=>{const role=sel.value,perms=[...document.querySelectorAll('#pmbox input[type=checkbox]')].filter(x=>x.checked).map(x=>x.value);
  await api('/api/role-perms',{method:'POST',body:JSON.stringify({role:role,perms:perms})});toast('Доступы роли сохранены');PM=await api('/api/perms');
  if(role===ME.role){const me=await api('/api/me');ME=me.user;renderNav()}}}
function drawPerms(role){const box=document.getElementById('pmbox');const cur=new Set((PM.rolePerms[role]||[]));
 const pages=PM.all.filter(x=>x.indexOf('page.')===0),mods=PM.all.filter(x=>x.indexOf('page.')!==0);
 const row=x=>'<label class="permrow"><span>'+esc(PM.labels[x]||x)+'</span><input type="checkbox" class="switch" value="'+esc(x)+'"'+(cur.has(x)?' checked':'')+'></label>';
 box.innerHTML='<h3 style="margin-top:6px">Разделы меню</h3><div class="permgrid">'+pages.map(row).join('')+'</div><h3 style="margin-top:16px">Точечные права</h3><div class="permgrid">'+mods.map(row).join('')+'</div>'
 +(role==='owner'?'<p class="note" style="margin-top:10px">Собственнику доступно всё независимо от галочек — защита от потери доступа.</p>':'')}
async function openUserPerms(uid,name){if(!can('admin.perms'))return;if(!PM)PM=await api('/api/perms');
 const ov=PM.userPerms[String(uid)]||{};
 const row=x=>{const st=(x in ov)?(ov[x]?'allow':'deny'):'';return '<label class="permrow"><span>'+esc(PM.labels[x]||x)+'</span><select data-perm="'+esc(x)+'" style="width:150px;border:1px solid var(--rule);border-radius:6px;padding:5px"><option value=""'+(st===''?' selected':'')+'>по роли</option><option value="allow"'+(st==='allow'?' selected':'')+'>разрешить</option><option value="deny"'+(st==='deny'?' selected':'')+'>запретить</option></select></label>'};
 openSheet('<h2>Права: '+esc(name)+'</h2><p class="note">Личные исключения поверх роли. «По роли» — как у всех с такой ролью.</p><h3>Разделы меню</h3>'
 +'<div class="permgrid">'+PM.all.filter(x=>x.indexOf('page.')===0).map(row).join('')+'</div><h3 style="margin-top:16px">Точечные права</h3><div class="permgrid">'+PM.all.filter(x=>x.indexOf('page.')!==0).map(row).join('')+'</div>'
 +'<button class="btn primary" id="upsave" style="margin-top:12px">Сохранить исключения</button>');
 document.getElementById('upsave').onclick=async()=>{const o={};document.querySelectorAll('[data-perm]').forEach(s=>{if(s.value)o[s.dataset.perm]=s.value});
  await api('/api/user-perms',{method:'POST',body:JSON.stringify({user_id:uid,overrides:o})});PM=await api('/api/perms');detail.hidden=true;toast('Исключения сохранены');loadUsers()}}

init().catch(e=>view.innerHTML='<div class="card"><h3>Ошибка запуска</h3><p>'+esc(e.message)+'</p></div>')
</script></body></html>
